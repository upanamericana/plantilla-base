<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img"
     aria-label="Tres piezas de izquierda a derecha. A la izquierda, la ventana de una herramienta de IA: arriba, la pregunta que se le hizo; abajo, su primera respuesta, la alternativa más probable. De la ventana salen tres flechas que se abren en abanico hacia tres tarjetas, una sobre otra, cada una con la pregunta que la produjo: «Dame otra opción», con otra alternativa; «Argumenta en contra», con un signo menos; «Dime qué te falta», con un hueco punteado. Las tres flechas se juntan en una sola y llegan a la derecha, donde está la persona que decide, con lo que la herramienta no conoce a su lado: el contexto interno, lo informal y las consecuencias. Debajo de la persona, la alternativa elegida, marcada con un visto: la única pieza con el contorno en dorado.">
  <!-- Ilustración de marca · Posgrados Panamericana · plantilla-base, tema 2 (muestra de la familia)
       Misma idea que la muestra de la plantilla de Andina (UP-001, D9), redibujada en la familia de UP
       (la de demo-unidad-3): fondo verde claro degradado, piezas blancas con sombra verde, trazo verde,
       Seravek. Sistema ortogonal y diagonal: el abanico se abre y se cierra con tramos rectos y
       diagonales, sin curvas y sin tarjetas giradas; ninguna flecha toca una tarjeta.
       Idea: la primera respuesta de la herramienta es «la alternativa más probable»; tres preguntas
       («Dame otra opción», «Argumenta en contra», «Dime qué te falta») sirven para «ampliar el
       abanico»; la herramienta no conoce el «contexto interno», «lo informal» ni «las consecuencias»:
       decidir «cuál alternativa es viable» queda del lado de quien decide.
       Único dorado: el contorno de la alternativa elegida. -->
  <defs>
    <linearGradient id="ilu-abanico-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#E4EEEB"/>
      <stop offset="55%"  stop-color="#ECF1EF"/>
      <stop offset="100%" stop-color="#F6F8F7"/>
    </linearGradient>
    <filter id="ilu-abanico-sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0A4039" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="440" rx="18" fill="url(#ilu-abanico-fondo)"/>

  <!-- Las piezas: la herramienta, las tres preguntas y el lado de quien decide -->
  <g filter="url(#ilu-abanico-sombra)" fill="#FFFFFF">
    <rect x="40"  y="62"  width="280" height="276" rx="16"/>
    <rect x="500" y="62"  width="260" height="84"  rx="14"/>
    <rect x="500" y="158" width="260" height="84"  rx="14"/>
    <rect x="500" y="254" width="260" height="84"  rx="14"/>
    <rect x="880" y="62"  width="280" height="276" rx="16"/>
  </g>

  <!-- ══ 1 · La herramienta: cómo se le preguntó y su primera respuesta ══ -->
  <g fill="#0A4039" opacity=".2">
    <circle cx="64" cy="86" r="4.5"/>
    <circle cx="80" cy="86" r="4.5"/>
    <circle cx="96" cy="86" r="4.5"/>
  </g>
  <rect x="56" y="104" width="248" height="2.5" rx="1.25" fill="#0A4039" opacity=".12"/>
  <!-- la pregunta -->
  <rect x="140" y="120" width="160" height="50" rx="14" fill="#0F5C51" opacity=".12"/>
  <g fill="#0A4039" opacity=".3">
    <rect x="158" y="134" width="124" height="8" rx="4"/>
    <rect x="158" y="150" width="84" height="8" rx="4"/>
  </g>
  <!-- la primera respuesta, la más probable -->
  <rect x="60" y="186" width="200" height="132" rx="12" fill="#E3EBEA"/>
  <circle cx="82" cy="210" r="9" fill="#0F5C51" opacity=".85"/>
  <rect x="100" y="205" width="120" height="10" rx="5" fill="#0A4039" opacity=".5"/>
  <g fill="#0A4039" opacity=".28">
    <rect x="76" y="234" width="166" height="8" rx="4"/>
    <rect x="76" y="252" width="150" height="8" rx="4"/>
    <rect x="76" y="270" width="160" height="8" rx="4"/>
    <rect x="76" y="288" width="110" height="8" rx="4"/>
  </g>

  <!-- ══ 2 · El abanico se abre: una pregunta por tarjeta ══ -->
  <g fill="none" stroke="#0F5C51" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".75">
    <path d="M334 200 H364 L460 104 H486"/>
    <path d="M478 96 l8 8 -8 8"/>
    <path d="M334 200 H486"/>
    <path d="M478 192 l8 8 -8 8"/>
    <path d="M364 200 L460 296 H486"/>
    <path d="M478 288 l8 8 -8 8"/>
  </g>

  <!-- Dame otra opción: otra alternativa -->
  <rect x="516" y="76" width="140" height="26" rx="13" fill="#0F5C51" opacity=".12"/>
  <text x="586" y="94" text-anchor="middle" font-family="Seravek, 'Source Sans 3', system-ui, sans-serif"
        font-size="14" font-weight="600" fill="#0A4039">Dame otra opción</text>
  <g fill="#0A4039" opacity=".28">
    <rect x="516" y="114" width="150" height="8" rx="4"/>
    <rect x="516" y="128" width="110" height="8" rx="4"/>
  </g>
  <circle cx="722" cy="118" r="10" fill="#0F5C51" opacity=".85"/>

  <!-- Argumenta en contra: contra su propia primera respuesta -->
  <rect x="516" y="172" width="160" height="26" rx="13" fill="#0F5C51" opacity=".12"/>
  <text x="596" y="190" text-anchor="middle" font-family="Seravek, 'Source Sans 3', system-ui, sans-serif"
        font-size="14" font-weight="600" fill="#0A4039">Argumenta en contra</text>
  <g fill="#0A4039" opacity=".28">
    <rect x="516" y="210" width="150" height="8" rx="4"/>
    <rect x="516" y="224" width="110" height="8" rx="4"/>
  </g>
  <circle cx="722" cy="214" r="13" fill="none" stroke="#0F5C51" stroke-width="3"/>
  <line x1="715" y1="214" x2="729" y2="214" stroke="#0F5C51" stroke-width="3" stroke-linecap="round"/>

  <!-- Dime qué te falta: la información que le faltó -->
  <rect x="516" y="268" width="140" height="26" rx="13" fill="#0F5C51" opacity=".12"/>
  <text x="586" y="286" text-anchor="middle" font-family="Seravek, 'Source Sans 3', system-ui, sans-serif"
        font-size="14" font-weight="600" fill="#0A4039">Dime qué te falta</text>
  <g fill="#0A4039" opacity=".28">
    <rect x="516" y="306" width="150" height="8" rx="4"/>
    <rect x="516" y="320" width="110" height="8" rx="4"/>
  </g>
  <rect x="700" y="296" width="44" height="30" rx="6" fill="none" stroke="#0A4039" stroke-width="2.5"
        stroke-dasharray="5 5" opacity=".7"/>

  <!-- ══ El abanico se cierra: las tres alternativas llegan a quien decide ══ -->
  <g fill="none" stroke="#0F5C51" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".55">
    <path d="M774 104 H786 L834 200"/>
    <path d="M774 296 H786 L834 200"/>
    <path d="M774 200 H866"/>
    <path d="M858 192 l8 8 -8 8"/>
  </g>

  <!-- ══ 3 · Quien decide, con lo que la herramienta no conoce ══ -->
  <circle cx="930" cy="118" r="14" fill="none" stroke="#0F5C51" stroke-width="4"/>
  <path d="M910 160 a20 15 0 0 1 40 0" fill="none" stroke="#0F5C51" stroke-width="4" stroke-linecap="round"/>

  <!-- el contexto interno: la organización -->
  <rect x="984" y="82" width="24" height="30" rx="3" fill="none" stroke="#0A4039" stroke-width="2.5" opacity=".85"/>
  <g fill="#0A4039" opacity=".6">
    <rect x="989" y="88" width="5" height="5" rx="1"/>
    <rect x="998" y="88" width="5" height="5" rx="1"/>
    <rect x="989" y="97" width="5" height="5" rx="1"/>
    <rect x="998" y="97" width="5" height="5" rx="1"/>
    <rect x="993" y="105" width="6" height="7" rx="1"/>
  </g>
  <!-- lo informal: las personas y sus acuerdos -->
  <g fill="none" stroke="#0A4039" stroke-width="2.5" stroke-linecap="round" opacity=".85">
    <circle cx="990" cy="135" r="5"/>
    <circle cx="1003" cy="135" r="5"/>
    <path d="M982 152 a8 7 0 0 1 16 0"/>
    <path d="M995 152 a8 7 0 0 1 16 0"/>
  </g>
  <!-- las consecuencias: la balanza -->
  <g fill="none" stroke="#0A4039" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".85">
    <line x1="996" y1="172" x2="996" y2="198"/>
    <line x1="988" y1="198" x2="1004" y2="198"/>
    <line x1="982" y1="176" x2="1010" y2="176"/>
    <path d="M982 176 L976 187 M982 176 L988 187 M1010 176 L1004 187 M1010 176 L1016 187"/>
    <path d="M975 187 h14 l-7 6 z M1003 187 h14 l-7 6 z"/>
  </g>
  <g font-family="Seravek, 'Source Sans 3', system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F5C51">
    <text x="1026" y="102">contexto interno</text>
    <text x="1026" y="148">lo informal</text>
    <text x="1026" y="190">las consecuencias</text>
  </g>

  <!-- la persona elige -->
  <g fill="none" stroke="#0F5C51" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".55">
    <line x1="930" y1="176" x2="930" y2="222"/>
    <path d="M922 214 l8 8 8 -8"/>
  </g>
  <!-- la alternativa elegida -->
  <rect x="900" y="236" width="240" height="78" rx="12" fill="#ECF1EF"/>
  <circle cx="936" cy="275" r="15" fill="#0F5C51"/>
  <path d="M929 275 l5 5 9 -10" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#0A4039" opacity=".3">
    <rect x="964" y="262" width="150" height="9" rx="4.5"/>
    <rect x="964" y="280" width="110" height="9" rx="4.5"/>
  </g>
  <!-- ÚNICO DORADO: la alternativa viable la elige la persona -->
  <rect x="900" y="236" width="240" height="78" rx="12" fill="none" stroke="#B9975B" stroke-width="4"/>

  <!-- Rótulos, literales del texto -->
  <g font-family="Seravek, 'Source Sans 3', system-ui, sans-serif" font-size="17" text-anchor="middle">
    <g font-weight="600" fill="#0A4039">
      <text x="180"  y="374">primera respuesta</text>
      <text x="630"  y="374">las tres preguntas</text>
      <text x="1020" y="374">quien decide</text>
    </g>
    <g font-weight="400" fill="#0F5C51">
      <text x="180"  y="400">la alternativa más probable</text>
      <text x="630"  y="400">ampliar el abanico</text>
      <text x="1020" y="400">cuál alternativa es viable</text>
    </g>
  </g>
</svg>
