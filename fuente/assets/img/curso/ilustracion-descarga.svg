<!-- UP-001: pieza del catálogo con la paleta de UP, sin el escalón de cuadros de Andina (D9). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" role="img" aria-labelledby="t">
  <title id="t">Documentos apilados con una lupa</title>
  <!-- sombra -->
  <ellipse cx="200" cy="312" rx="6" ry="6" fill="#0F5C51" opacity=".10"/>
  <!-- documento de atrás -->
  <g transform="rotate(-8 230 160)">
    <rect x="170" y="40" width="170" height="230" rx="6" fill="#ECF1EF"/>
    <rect x="170" y="40" width="170" height="26" rx="6" fill="#3F7D74"/>
  </g>
  <!-- documento del medio -->
  <g transform="rotate(4 200 170)">
    <rect x="130" y="52" width="170" height="232" rx="6" fill="#FFFFFF" stroke="#DCE4E1" stroke-width="2"/>
    <rect x="130" y="52" width="170" height="26" rx="6" fill="#0F5C51"/>
    <rect x="150" y="98" width="110" height="9" rx="4.5" fill="#DCE4E1"/>
    <rect x="150" y="118" width="130" height="9" rx="4.5" fill="#DCE4E1"/>
    <rect x="150" y="138" width="90" height="9" rx="4.5" fill="#DCE4E1"/>
  </g>
  <!-- documento de adelante -->
  <rect x="80" y="70" width="176" height="236" rx="6" fill="#FFFFFF" stroke="#B7CFC9" stroke-width="2"/>
  <rect x="80" y="70" width="176" height="44" rx="6" fill="#0A4039"/>
  <rect x="80" y="100" width="176" height="14" fill="#0A4039"/>
  <rect x="100" y="86" width="12" height="12" fill="#4B857C"/><rect x="108" y="94" width="12" height="12" fill="#0F5C51"/>
  <rect x="130" y="88" width="90" height="8" rx="4" fill="#FFFFFF" opacity=".85"/>
  <rect x="100" y="134" width="136" height="8" rx="4" fill="#CFE0DC"/>
  <rect x="100" y="152" width="120" height="8" rx="4" fill="#CFE0DC"/>
  <rect x="100" y="170" width="132" height="8" rx="4" fill="#CFE0DC"/>
  <!-- gráfico de barras -->
  <rect x="100" y="230" width="18" height="44" rx="3" fill="#4B857C"/>
  <rect x="126" y="212" width="18" height="62" rx="3" fill="#3F7D74"/>
  <rect x="152" y="196" width="18" height="78" rx="3" fill="#0F5C51"/>
  <rect x="96" y="276" width="80" height="3" rx="1.5" fill="#B7CFC9"/>
  <rect x="190" y="200" width="46" height="8" rx="4" fill="#CFE0DC"/>
  <rect x="190" y="218" width="36" height="8" rx="4" fill="#CFE0DC"/>
  <!-- lupa -->
  <line x1="300" y1="240" x2="352" y2="296" stroke="#0A4039" stroke-width="16" stroke-linecap="round"/>
  <circle cx="268" cy="206" r="54" fill="#4B857C" fill-opacity=".22" stroke="#0F5C51" stroke-width="12"/>
  <path d="M240 186 a34 34 0 0 1 24 -14" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity=".9"/>
  <!-- descarga -->
  <circle cx="352" cy="96" r="30" fill="#0F5C51"/>
  <path d="M352 80 v26 M341 96 l11 11 l11 -11 M338 114 h28" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
