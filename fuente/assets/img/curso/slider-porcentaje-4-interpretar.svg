<!-- UP-001: figura de ejemplo del catálogo con la paleta de UP, sin el escalón de cuadros de Andina (D9). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400" role="img" aria-label="Cuarenta figuras de estudiantes en cuatro filas de diez; la primera fila, diez figuras, resaltada en dorado: una cuarta parte.">
  <!-- Plantilla base · Slider de pasos · paso 4. Imagen sugerida: 40 figuras de estudiantes con 10 resaltadas en otro color. Las 10 forman una de las cuatro filas: se ve la cuarta parte. Único dorado: las 10.
       Familia: fondo verde claro degradado, piezas blancas con sombra, trazo verde, un solo dorado. -->
